services:
  web:
    build:
      context: .
    image: can-bus-replay:latest
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
    ports:
      # 宿主端口可配置：HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # 一次性验收服务：代码测试 + 构建检查 + 页面/健康 HTTP 冒烟 +
  # 正常仲裁 / 被动错误 / bus-off 恢复三类可观察结果；结束即退出，退出码反映验收结果。
  # 运行：docker compose build verify && docker compose run --rm verify
  verify:
    build:
      context: .
    image: can-bus-replay:verify
    environment:
      VERIFY_PORT: "8090"
      VERIFY_WEB_BASE: "http://web:8080"
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
    command: ["node", "scripts/verify.cjs"]
